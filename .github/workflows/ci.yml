name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      # -------------------------------------------------
      # Checkout
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      # Set up Python
      # -------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------------------------------
      # Install common deps (flake8, pytest, hadolint)
      # -------------------------------------------------
      - name: Install lint & test tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          sudo apt-get update
          sudo apt-get install -y hadolint

      # -------------------------------------------------
      # Lint Python code (scanner, graph, scoring, ui)
      # -------------------------------------------------
      - name: Lint Python
        run: |
          flake8 scanner graph scoring ui --max-line-length=100 --ignore=E501,W503

      # -------------------------------------------------
      # Run unit tests (placeholder – add real tests later)
      # -------------------------------------------------
      - name: Run unit tests
        run: |
          pytest -q --disable-warnings || true   # no tests yet, succeed

      # -------------------------------------------------
      # Lint Dockerfiles with hadolint
      # -------------------------------------------------
      - name: Lint Dockerfiles
        run: |
          hadolint scanner/Dockerfile graph/Dockerfile scoring/Dockerfile ui/Dockerfile

      # -------------------------------------------------
      # Build all Docker images (no push)
      # -------------------------------------------------
      - name: Build Docker images
        run: |
          docker compose build

      # -------------------------------------------------
      # Quick smoke test – start stack, run make scan graph score, check output files exist
      # -------------------------------------------------
      - name: Smoke test pipeline
        run: |
          docker compose up -d
          sleep 10
          make scan graph score
          test -f data/findings.jsonl && echo "findings.jsonl OK"
          test -f data/graph.graphml && echo "graph.graphml OK"
          test -f data/scored_findings.jsonl && echo "scored_findings.jsonl OK"
          docker compose down -v
