version: "3.9"

services:
  # -------------------------------------------------
  # 0️⃣ LocalStack – AWS emulation (must start first)
  # -------------------------------------------------
  localstack:
    image: localstack/localstack:1.4.0
    container_name: cspm-localstack
    ports:
      - "4566:4566"
      - "4571:4571"
    environment:
      - SERVICES=s3,iam,lambda,sts,ec2,dynamodb
      - START_WEB=0
      - DEBUG=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  # -------------------------------------------------
  # 1️⃣ Scanner – reads cloud API, emits findings.jsonl
  # -------------------------------------------------
  scanner:
    build:
      context: ./scanner
      dockerfile: Dockerfile
    container_name: cspm-scanner
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - ENDPOINT_URL=http://localstack:4566
    volumes:
      - ./scanner:/app
      - ./data:/data
    command: ["sleep", "infinity"]
    depends_on:
      localstack:
        condition: service_healthy

  # -------------------------------------------------
  # 2️⃣ Graph builder – reads IAM policies, writes graph.graphml
  # -------------------------------------------------
  graph:
    build:
      context: ./graph
      dockerfile: Dockerfile
    container_name: cspm-graph
    volumes:
      - ./graph:/app
      - ./data:/data
    command: ["sleep", "infinity"]

  # -------------------------------------------------
  # 3️⃣ Scoring engine – reads findings + graph, writes scored_findings.jsonl
  # -------------------------------------------------
  scorer:
    build:
      context: ./scoring
      dockerfile: Dockerfile
    container_name: cspm-scorer
    volumes:
      - ./scoring:/app
      - ./data:/data
    command: ["sleep", "infinity"]

  # -------------------------------------------------
  # 4️⃣ UI – Streamlit dashboard (port 8501)
  # -------------------------------------------------
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: cspm-ui
    ports:
      - "8501:8501"
    volumes:
      - ./ui:/app
      - ./data:/data
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
